services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${PUBLIC_SITE_URL:-https://matiaslorenzo.fullware.com.ar}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://matiaslorenzo.fullware.com.ar}
        PUBLIC_SITEKEY_TURNSTILE: ${PUBLIC_SITEKEY_TURNSTILE:-}
    restart: unless-stopped
    # El resolver del host a veces no responde desde la red de Docker (EAI_AGAIN),
    # y sin DNS no hay email (Resend) ni verificación anti-bot (Turnstile).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./secrets/.dev.vars:/app/dist/server/.dev.vars:ro
      - promo_state:/data
    # El tunel de Cloudflare (Mytunnel) enruta matiaslorenzo.fullware.com.ar
    # hacia http://192.168.0.94:8027: por eso el puerto se publica en el host.
    ports:
      - '8027:4321'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

volumes:
  promo_state:
